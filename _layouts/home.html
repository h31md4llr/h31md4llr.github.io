<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">
  </head>
  <body>
    <div class="home-wrap">
      <header class="home-header">
        <div>
          <a class="home-name" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
          <p class="home-subtitle">{{ site.description | escape }}</p>
        </div>

        <nav class="home-nav" aria-label="Primary navigation">
          <a href="{{ '/research/' | relative_url }}">Research</a>
          <a href="{{ '/activities/' | relative_url }}">Activities</a>
        </nav>
      </header>

      <main>
        {{ content }}
      </main>

      <footer class="home-footer">
        &copy; {{ "now" | date: "%Y" }} {{ site.title | escape }}
      </footer>
    </div>
  </body>
</html>
